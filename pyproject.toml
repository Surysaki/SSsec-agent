[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sssec"
version = "0.2.0"
description = "SSsec — 面向授权安全测试的本地桌面 AI Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "httpx>=0.27,<1",
    "dnspython>=2.7,<3",
    "Markdown>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.10,<7",
]

[project.scripts]
sssec = "sssec.app:main"

[tool.setuptools.packages.find]
include = ["sssec*"]

[tool.setuptools.package-data]
sssec = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
